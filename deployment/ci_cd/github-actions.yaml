# HELIOS OS + SEVRA AI
# Section 15: CI/CD Pipeline
name: Production Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov bandit
          
      - name: Run Security Scan (Bandit)
        run: bandit -r backend/ -c pyproject.toml
        
      - name: Run Test Suite (Coverage > 90%)
        run: pytest backend/ --cov=backend/ --cov-fail-under=90

  build-and-push:
    needs: test-and-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile.backend
          push: true
          tags: ghcr.io/organization/helios-backend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Update Kubernetes Deployment
        run: |
          # Command to update k8s manifests with new image tag
          # kubectl set image deployment/dashboard-api dashboard-api=ghcr.io/...
          echo "Deploying to EKS/GKE cluster"
