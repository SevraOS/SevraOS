# HELIOS OS + SEVRA AI
# Section 13: Docker Architecture
version: '3.8'

services:
  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: helios_central
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d helios_central"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard-api:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile.backend
      target: final-base
    image: helios-backend:latest
    environment:
      - HELIOS_ENVIRONMENT=production
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - HELIOS_POSTGRES_DSN=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/helios_central
    ports:
      - "8080:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  ai-service:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile.backend
      target: final-full
    image: helios-ai:latest
    command: ["uvicorn", "ai.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  integration-service:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile.backend
      target: final-base
    image: helios-integration:latest
    command: ["python", "-m", "integration.sync.engine"]
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  redis_data:
  pg_data:
  minio_data:
