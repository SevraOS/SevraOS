# Glucometer Collector Configuration
# HELIOS OS + SEVRA AI

device_id: "GLU-BED-01-ICU"
device_type: "glucometer"
facility_id: "FACILITY-001"
ward: "ICU"
bed: "BED-01"

# Transport: "usb" or "serial"
transport: "usb"

# USB settings (used when transport = usb)
vendor_id: 0x2DAD
product_id: 0x0001
interface: 0
endpoint: 0x81
read_size: 64
read_timeout_ms: 2000

# Serial settings (used when transport = serial)
port: "/dev/ttyUSB5"     # Windows: "COM8"
baud_rate: 9600
frame_delimiter: "\r\n"
read_timeout: 2.0

# Collector settings
frame_buffer_size: 128
reconnect_base_delay: 2.0
reconnect_max_delay: 120.0
reconnect_factor: 2.0
max_reconnect_attempts: 0
