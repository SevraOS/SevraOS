# Ventilator Collector Configuration
# HELIOS OS + SEVRA AI

device_id: "VENT-BED-01-ICU"
device_type: "ventilator"
facility_id: "FACILITY-001"
ward: "ICU"
bed: "BED-01"

# Transport: "socket" or "serial"
transport: "socket"

# Socket settings (used when transport = socket)
host: "192.168.1.102"
tcp_port: 2575           # Standard HL7 MLLP port
protocol: "mllp"         # "mllp" or "raw"
connect_timeout: 10.0
read_timeout: 5.0

# Serial settings (used when transport = serial)
port: "/dev/ttyUSB3"    # Windows: "COM6"
baud_rate: 9600
read_timeout: 2.0

# Collector settings
frame_buffer_size: 128
reconnect_base_delay: 2.0
reconnect_max_delay: 120.0
reconnect_factor: 2.0
max_reconnect_attempts: 0
