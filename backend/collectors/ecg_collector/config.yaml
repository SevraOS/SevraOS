# ECG Collector Configuration
# HELIOS OS + SEVRA AI

device_id: "ECG-BED-01-ICU"
device_type: "ecg"
facility_id: "FACILITY-001"
ward: "ICU"
bed: "BED-01"

# Transport: "serial" or "socket"
transport: "serial"

# Serial settings (used when transport = serial)
port: "/dev/ttyUSB0"      # Windows: "COM3"
baud_rate: 115200
bytesize: 8
parity: "N"
stopbits: 1
frame_delimiter: "\r\n"

# Socket settings (used when transport = socket)
host: "192.168.1.101"
tcp_port: 5000
read_timeout: 5.0
connect_timeout: 10.0

# Collector settings
frame_buffer_size: 512
reconnect_base_delay: 1.0
reconnect_max_delay: 60.0
reconnect_factor: 2.0
max_reconnect_attempts: 0    # 0 = infinite retries
