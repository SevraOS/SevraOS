# Infusion Pump Collector Configuration
# HELIOS OS + SEVRA AI

device_id: "INF-BED-01-ICU"
device_type: "infusion_pump"
facility_id: "FACILITY-001"
ward: "ICU"
bed: "BED-01"

# Transport: "serial" or "socket"
transport: "serial"

# Serial settings (used when transport = serial)
port: "/dev/ttyUSB4"     # Windows: "COM7"
baud_rate: 9600
read_timeout: 2.0
frame_delimiter: "\r\n"

# Socket settings (used when transport = socket)
host: "192.168.1.103"
tcp_port: 5001
connect_timeout: 10.0

# Adapter mode: "auto" | "binary" | "ascii"
adapter_mode: "auto"

# Binary mode: fixed 16-byte frame size
frame_size: 16

# Collector settings
frame_buffer_size: 256
reconnect_base_delay: 2.0
reconnect_max_delay: 120.0
reconnect_factor: 2.0
max_reconnect_attempts: 0
