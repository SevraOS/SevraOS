[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helios-sevra-backend"
version = "1.0.0"
description = "HELIOS OS + SEVRA AI — Healthcare Intelligence Platform Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.12",
    "anyio>=4.6.0",
    "tenacity>=9.0.0",
    "orjson>=3.10.0",
    # ── MDIL / Transport dependencies ──
    "pyserial-asyncio>=0.6",
    "bleak>=0.22.3",
    "pyusb>=1.2.1",
    "hl7>=0.4.5",
    "bitstring>=4.2.3",
    "crcmod>=1.7",
    # ── AI / Auth dependencies ──
    "PyJWT>=2.8.0",
    "onnxruntime>=1.16.3",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.1",
    "faker>=33.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "types-pyyaml>=6.0.12",
    "types-passlib>=1.7.7",
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "TCH"]
ignore = ["E501", "B008", "B904"]

[tool.ruff.isort]
known-first-party = ["helios"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "mdil/tests", "collectors/tests", "validation/tests", "normalization/tests", "pipeline/tests", "eventbus/tests"]
addopts = "-v --timeout=15"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
omit = ["tests/*", "migrations/*", "deployment/*"]

[tool.hatch.build.targets.wheel]
packages = ["."]
