# Alembic database migration configuration
# HELIOS OS + SEVRA AI — PostgreSQL migrations

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# PostgreSQL DSN — loaded from environment at runtime
sqlalchemy.url = postgresql+asyncpg://%(HELIOS_POSTGRES_USER)s:%(HELIOS_POSTGRES_PASSWORD)s@%(HELIOS_POSTGRES_HOST)s:%(HELIOS_POSTGRES_PORT)s/%(HELIOS_POSTGRES_DB)s

[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.executable = %(here)s/../.venv/bin/ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
