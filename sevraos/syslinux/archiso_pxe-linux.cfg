LABEL arch_nbd
TEXT HELP
Boot the SevraOS install medium using NBD.
It allows you to install SevraOS or perform system maintenance.
ENDTEXT
MENU LABEL SevraOS install medium (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-rt
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-rt.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y
SYSAPPEND 3

LABEL arch_nfs
TEXT HELP
Boot the SevraOS live medium using NFS.
It allows you to install SevraOS or perform system maintenance.
ENDTEXT
MENU LABEL SevraOS install medium (%ARCH%, NFS)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-rt
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-rt.img
APPEND archisobasedir=%INSTALL_DIR% archiso_nfs_srv=${pxeserver}:/run/archiso/bootmnt cms_verify=y
SYSAPPEND 3

LABEL arch_http
TEXT HELP
